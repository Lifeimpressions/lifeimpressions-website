<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2430">
<title>Lifeimpressions Studio Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio Tracker">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  /* Dark navy sidebar + light content, one bright blue accent (sampled from brand reference) */
  --ground:#F3F5FA; --surface:#FFFFFF; --sunk:#EEF1F6; --ink:#161A2E; --ink2:#6B7280; --line:#E2E6EF;
  --accent:#2F6FEB; --onAccent:#FFFFFF; --accentBg:#E9F1FF;
  --gold:var(--accent); --onGold:var(--onAccent);
  --bronze:#8A6A1F; --bronzeBg:#F3EDDD;
  --rose:#C23D4B; --roseBg:#FAE3E6;
  --teal:#1FA568; --tealBg:#E1F5EA;
  --focus:#2F6FEB; --scrim:rgba(13,15,30,.55);
  --bubbleIn:#FFFFFF; --bubbleOut:var(--accentBg); --chat:#EEF1F6;
  --sidebar-bg:#0F102E; --sidebar-ink:#ECEEF8; --sidebar-ink2:#9195B8; --sidebar-line:rgba(255,255,255,.09); --sidebar-active:var(--accent);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,'Noto Sans Tamil',sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,-apple-system,'Noto Sans Tamil',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#10111C; --surface:#181A2A; --sunk:#1F2133; --ink:#ECEEF8; --ink2:#9195B8; --line:#2A2D42;
    --accent:#5B8FF9; --onAccent:#0B1024; --accentBg:#1C2742;
    --gold:var(--accent); --onGold:var(--onAccent);
    --bronze:#D8B463; --bronzeBg:#302A16; --rose:#E0858C; --roseBg:#35211F; --teal:#4FC98A; --tealBg:#15301F;
    --focus:#7EA6FF; --scrim:rgba(0,0,0,.6); --bubbleIn:#1F2133; --bubbleOut:var(--accentBg); --chat:#14151F;
    --sidebar-bg:#07081A; --sidebar-ink:#ECEEF8; --sidebar-ink2:#80849E; --sidebar-line:rgba(255,255,255,.07); --sidebar-active:var(--accent);
  }
}
html{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.15}
h1{font-size:30px} h2{font-size:19px} h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;align-self:start;padding:0;display:flex;flex-direction:column;background:var(--sidebar-bg);min-height:100vh;color:var(--sidebar-ink)}
.brand{background:#FFFFFF;padding:16px 14px}
.brand img{width:100%;max-width:190px;height:auto;display:block}
.side-body{padding:18px 14px 22px;display:flex;flex-direction:column;gap:18px}
.side-caption{font-size:12px;color:var(--sidebar-ink2);padding:0 10px;margin-top:-6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;border-radius:8px;text-align:left;color:var(--sidebar-ink2);font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06);color:var(--sidebar-ink)}
.nav button[aria-current="page"]{background:var(--sidebar-active);color:var(--onAccent)}
.nav svg,.tabbar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sidenote{margin:0 10px;padding:12px;border:1px solid var(--sidebar-line);border-radius:10px;font-size:13px;color:var(--sidebar-ink2);display:flex;flex-direction:column;gap:8px}
.sidenote .btn.ghost{color:var(--sidebar-ink);border-color:var(--sidebar-line)}
.sidenote .btn.ghost:hover{background:rgba(255,255,255,.08)}
.sidenote p.small{color:var(--sidebar-ink2)}
main{padding:22px 28px 60px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:22px}
.top .who{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field-inline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
select,input[type=text],input[type=email],input[type=password],input[type=tel],input[type=date],input[type=time],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%}
.field-inline select{width:auto}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
label.f span.h{font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border-radius:9px;border:1px solid var(--ink);background:var(--ink);color:var(--surface);font-weight:600}
.btn:hover{filter:brightness(1.12)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--onGold)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.filebtn{position:relative;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;min-height:0;padding:0}
.filebtn:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--ink2)}
.chip.late,.chip.change{background:var(--roseBg);color:var(--rose)}
.chip.call{background:var(--rose);color:var(--surface)}
.chip.wait{background:var(--bronzeBg);color:var(--bronze)}
.chip.ok{background:var(--tealBg);color:var(--teal)}
.chip.src{background:transparent;border:1px solid var(--line)}
.muted{color:var(--ink2)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.panel > h2{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:18px}
.stat{padding:16px 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{font-family:var(--display);font-size:32px;display:block;line-height:1.1}
.stat span{font-size:13px;color:var(--ink2)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item .t{min-width:0}
.item .t b{display:block}
.empty{padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--ink2);font-size:14px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.col{flex:0 0 252px;scroll-snap-align:start;background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col header{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 4px}
.col header b{font-family:var(--display);font-size:14.5px}
.col header span{font-size:12px;color:var(--ink2)}
.card{display:flex;flex-direction:column;gap:7px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px}
.card:hover{border-color:var(--ink2)}
.card b{font-size:14.5px}
.card .meta{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;color:var(--ink2)}
.card .flags{display:flex;gap:5px;flex-wrap:wrap}
.who-dot{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:11px;font-weight:700}
.enqcol{flex:0 0 268px}
.card.enq{cursor:default}
.card.enq select{min-height:36px;padding:4px 8px;font-size:13.5px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:110px 1fr 74px;gap:10px;align-items:center;font-size:13.5px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--sunk);position:relative;overflow:hidden}
.bar i u{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:5px}
.bar i u.g{background:var(--gold)}
.bar span:last-child{text-align:right;color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink2);border-top:0;font-size:13px}
.tablewrap{overflow-x:auto}
table.qc td{vertical-align:middle}
table.qc input[type=text]{min-height:36px;font-size:13.5px;padding:6px 8px}
table.qc input[type=checkbox]{width:22px;height:22px;cursor:pointer}
table.qc input:disabled{cursor:not-allowed;opacity:.65}
table.qc th.qcchk,table.qc td.qcchk{text-align:center;width:88px}
.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;justify-content:flex-end;z-index:30}
.overlay.center{justify-content:center;align-items:center;padding:16px}
.sheet{background:var(--ground);width:min(1000px,100%);height:100%;overflow:auto;padding:20px 24px 30px}
.dialog{background:var(--surface);width:min(620px,100%);max-height:100%;overflow:auto;border-radius:16px;padding:22px;border:1px solid var(--line)}
.sheet:focus,.dialog:focus{outline:none}
.jhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}
.jgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.facts dt{font-size:12.5px;color:var(--ink2)}
.facts dd{margin:0;font-weight:600}
.track{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:14px 0 6px}
.track i{height:8px;border-radius:4px;background:var(--line)}
.track i.done{background:var(--ink)}
.track i.now{background:var(--gold)}
.check{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check .l b{display:block}
.rule{padding:10px 12px;border-radius:9px;background:var(--bronzeBg);color:var(--bronze);font-size:13.5px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumbs figure{margin:0;font-size:12px;color:var(--ink2)}
.thumbs img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
.phone{border:8px solid var(--ink);border-radius:32px;background:var(--chat);overflow:hidden;display:flex;flex-direction:column;height:520px}
.phone .bar1{background:var(--ink);color:var(--surface);padding:10px 14px;display:flex;gap:10px;align-items:center}
.phone .bar1 .av{width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--onGold);display:grid;place-items:center;font-weight:800;font-family:var(--display)}
.phone .bar1 small{display:block;opacity:.75;font-size:11.5px}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.dsep{align-self:center;font-size:11.5px;background:var(--surface);color:var(--ink2);padding:2px 10px;border-radius:99px;margin:6px 0}
.b{max-width:86%;padding:8px 10px;border-radius:10px;font-size:13.5px;line-height:1.4;background:var(--bubbleIn);color:var(--ink);align-self:flex-start;border-top-left-radius:2px;white-space:pre-wrap}
.b.in{align-self:flex-end;background:var(--bubbleOut);border-top-left-radius:10px;border-top-right-radius:2px}
.b small{display:block;color:var(--ink2);font-size:11px;margin-top:3px}
.phonefoot{padding:8px 10px;background:var(--surface);display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line)}
.demo{font-size:12.5px;color:var(--ink2);margin-top:8px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.addons{display:flex;gap:16px;flex-wrap:wrap}
.addons label{display:flex;gap:8px;align-items:center;min-height:44px}
.addons input{width:20px;height:20px}
.summary{background:var(--sunk);border-radius:10px;padding:12px 14px;display:grid;gap:4px;font-size:14px}
.summary div{display:flex;justify-content:space-between}
.summary .tot{font-weight:700;font-size:16px;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:10px;max-width:min(560px,92vw);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--rose);color:#fff}
.tabbar{display:none}
.mobile-brand{display:none}
.mscroll{display:contents}
.center-page{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:min(400px,100%);display:flex;flex-direction:column;gap:16px}
.login .msg{color:var(--rose);font-size:14px;min-height:20px}
.busy{opacity:.6;pointer-events:none}
@media (max-width:1100px){.jgrid{grid-template-columns:1fr}.phone{height:480px}}
@media (max-width:880px){
  html,body{height:100%;overflow:hidden}
  #app{height:100%}
  .mscroll{display:flex;flex-direction:column;height:100dvh;height:100vh}
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mobile-brand{display:flex;align-items:center;justify-content:center;background:#FFFFFF;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));flex:none;border-bottom:1px solid var(--line)}
  .mobile-brand img{height:32px;width:auto;display:block}
  .mscroll-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
  main{padding:16px 14px 24px}
  h1{font-size:25px}
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .grid2{grid-template-columns:1fr}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);flex:none;background:var(--surface);border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--ink2);font-size:10px;min-height:48px;padding:4px 1px;line-height:1.15}
  .tabbar svg{width:18px;height:18px}
  .tabbar button[aria-current="page"]{color:var(--accent);font-weight:700}
  .sheet{padding:14px 14px 30px}
  .form{grid-template-columns:1fr}
  .col{flex-basis:78vw}
  .bar{grid-template-columns:90px 1fr 64px}
  .toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<div id="app"></div>

<script src="config.js"></script>
<script>

};
var NAV=[['today','Today','today'],['jobs','Job board','jobs'],['enq','Enquiries','enq'],['sched','Schedule','sched'],['reports','Reports','reports'],['settings','Settings','settings']];
var TITLES={today:'Today',jobs:'Job board',enq:'Enquiries',sched:'Schedule',reports:'Reports',settings:'Settings'};

/* ------------------------------------------------------------------ state */
var CFG=window.APP_CONFIG||{};
var sb=null;
var S={me:null,ref:{},staff:[],jobs:[],cancelled:[],enq:[],workload:[],inbox:[],historyToday:[],briefTab:null,pushState:'unknown',pushBusy:false,files:{},urls:{},msgs:{},view:'today',locFilter:'all',modal:null,toast:null,busy:false,focusModal:false};

/* ------------------------------------------------------------------ helpers */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function inr(n){return '\u20B9'+Math.round(Number(n)||0).toLocaleString('en-IN');}
function todayISO(){return new Date(Date.now()+5.5*3600*1000).toISOString().slice(0,10);}
function istMidnightISO(offsetDays){
  var ist=new Date(Date.now()+5.5*3600*1000);
  var mid=Date.UTC(ist.getUTCFullYear(),ist.getUTCMonth(),ist.getUTCDate()+(offsetDays||0),0,0,0);
  return new Date(mid-5.5*3600*1000).toISOString();
}
function istHourNow(){return new Date(Date.now()+5.5*3600*1000).getUTCHours();}
function sheetOf(j){return j.job_sheet||{};}
function custCost(j){return parseFloat(sheetOf(j).customization_cost)||0;}
function totalCharges(j){return j.total+custCost(j)+(j.travel||0);}
function dueNow(j){return Math.max(0,totalCharges(j)-j.advance);}
function chargesHtml(j){
  var c=custCost(j),t=j.travel||0;
  function row(l,v,strong,idv){return '<div class="spread" style="padding:3px 0'+(strong?';font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:6px':'')+'"><span'+(strong?'':' class="muted"')+'>'+l+'</span><span'+(idv?' id="'+idv+'"':'')+'>'+v+'</span></div>';}
  return row('Service total (incl. 5% GST)',inr(j.total))+
    (c>0?row('Customization cost',inr(c)):'')+
    (t>0?row('Travel charges',inr(t)):'')+
    row('Total charges',inr(totalCharges(j)),true)+
    row('Advance paid','\u2212'+inr(j.advance))+
    row('Balance due',inr(dueNow(j)),true,'dt-balance');
}
function sheetAnswered(j){var sh=sheetOf(j);return Object.keys(sh).some(function(k){return sh[k]!==''&&sh[k]!==false&&sh[k]!=null;});}
function sheetChip(j){var sh=sheetOf(j);return sh.agreed?{c:'ok',t:'Agreed'}:(sheetAnswered(j)?{c:'wait',t:'In progress'}:{c:'',t:'Not filled'});}
function updateSheetLive(j){
  var ch=$('sh-chip'),st=sheetChip(j);if(ch){ch.className='chip '+st.c;ch.textContent=st.t;}
  var b1=$('sh-balance'),ch=$('dt-charges');if(b1)b1.textContent=inr(dueNow(j));if(ch)ch.innerHTML=chargesHtml(j);
}
async function saveSheet(j,patch){
  var old=j.job_sheet||{},next=Object.assign({},old,patch),oldProm=j.promised_delivery;
  j.job_sheet=next;j.promised_delivery=next.delivery_date||j.promised_db;
  updateSheetLive(j);
  var r=await sb.from('jobs').update({job_sheet:next}).eq('id',j.id);
  if(r.error){
    j.job_sheet=old;j.promised_delivery=oldProm;render();
    fail(/job_sheet/.test(r.error.message||'')?{message:'Run 09_job_sheet.sql in Supabase first, then try again.'}:r.error);
  }
}
function qcCount(j){var c=j.qc_checks||{};return QC_ITEMS.filter(function(it){return c[it[0]]&&c[it[0]].ok;}).length;}
function qcComplete(j){return qcCount(j)===QC_ITEMS.length;}
function firstName(n){return String(n||'').trim().split(/[\s&]+/)[0]||'there';}
function tplFor(k){return UPDATE_TPL.filter(function(t){return t.k===k;})[0]||UPDATE_TPL[0];}
function waLink(phone,text){
  var d=String(phone||'').replace(/\D/g,'');
  if(!d)return null;
  if(d.length===10)d='91'+d;
  return 'https://wa.me/'+d+'?text='+encodeURIComponent(text);
}
function staffName(id){var s=(S.staff||[]).filter(function(x){return x.id===id;})[0];return s?s.name:'System';}
function addISO(iso,n){var d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function diffISO(a,b){return Math.round((new Date(a+'T00:00:00Z')-new Date(b+'T00:00:00Z'))/86400000);}
function dt(iso){return iso&&iso.length===10?new Date(iso+'T00:00:00'):new Date(iso);}
function fmt(iso){return iso?dt(iso).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}):'';}
function fmtShort(iso){return iso?dt(iso).toLocaleDateString('en-IN',{day:'numeric',month:'short'}):'';}
function fmtTime(iso){return new Date(iso).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',timeZone:'Asia/Kolkata'});}
function idx(list,key){var m={};(list||[]).forEach(function(x){m[x[key||'id']]=x;});return m;}
function isAdmin(){return S.me&&S.me.role==='admin';}
function shortSvc(s){return String(s||'').replace('Baby Casting - ','Baby ').replace(' Casting','');}
function svg(k){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[k]+'</svg>';}
function chip(f){return '<span class="chip '+f.t+'">'+esc(f.l)+'</span>';}
function ini(name){return '<span class="who-dot" title="'+esc(name)+'">'+esc(String(name||'?').charAt(0))+'</span>';}
function stageIdx(j){return STAGE_KEYS.indexOf(j.stage);}
function scopeLoc(){if(S.me&&S.me.role!=='admin')return S.me.location_id;return S.locFilter==='all'?null:Number(S.locFilter);}
function vJobs(){var l=scopeLoc();return S.jobs.filter(function(j){return !l||j.location_id===l;});}
function vEnq(){var l=scopeLoc();return S.enq.filter(function(x){return !l||x.location_id===l;});}
function jobById(id){return S.jobs.filter(function(j){return j.id===id;})[0];}
function enqById(id){return S.enq.filter(function(x){return x.id===id;})[0];}
function locName(id){var l=(S.ref.locations||[]).filter(function(x){return x.id===id;})[0];return l?l.name:'';}
function jobFiles(j,kind){return (S.files[j.id]||[]).filter(function(f){return !kind||f.kind===kind;});}
function toast(msg,err){
  S.toast={msg:msg,err:!!err};
  var old=$('toast');if(old)old.remove();
  var el=document.createElement('div');el.id='toast';el.className='toast'+(err?' err':'');el.setAttribute('role','status');el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(toast.t);toast.t=setTimeout(function(){S.toast=null;var e=$('toast');if(e)e.remove();},4200);
}
function fail(e){toast((e&&e.message)?e.message:String(e),true);}
function pushSupported(){return 'serviceWorker' in navigator && 'PushManager' in window && !!(CFG.VAPID_PUBLIC_KEY) && CFG.VAPID_PUBLIC_KEY.indexOf('YOUR-')!==0;}
function iosNeedsHomeScreen(){
  var ua=navigator.userAgent||'';
  var isIOS=/iPhone|iPad|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  var standalone=('standalone' in navigator && navigator.standalone) || window.matchMedia('(display-mode: standalone)').matches;
  return isIOS && !standalone;
}
function b64urlToBytes(s){
  var pad='='.repeat((4-s.length%4)%4);
  var b=(s+pad).replace(/-/g,'+').replace(/_/g,'/');
  var raw=atob(b),out=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
  return out;
}
async function refreshPushState(){
  if(!pushSupported()){S.pushState=iosNeedsHomeScreen()?'ios-need-home-screen':'unsupported';return;}
  try{
    var reg=await navigator.serviceWorker.register('sw.js');
    var sub=await reg.pushManager.getSubscription();
    S.pushState=sub?'on':(Notification.permission==='denied'?'denied':'off');
  }catch(e){S.pushState='unsupported';}
}
async function enablePush(){
  if(S.pushBusy)return;S.pushBusy=true;render();
  try{
    var reg=await navigator.serviceWorker.register('sw.js');
    var perm=await Notification.requestPermission();
    if(perm!=='granted'){S.pushState=perm==='denied'?'denied':'off';S.pushBusy=false;render();return;}
    var sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64urlToBytes(CFG.VAPID_PUBLIC_KEY)});
    var j=sub.toJSON();
    var r=await sb.from('push_subscriptions').insert({staff_id:S.me.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth});
    if(r.error && r.error.code!=='23505')throw r.error;
    S.pushState='on';toast('Daily reminders are on for this device.');
  }catch(e){fail(e);}
  S.pushBusy=false;render();
}
async function disablePush(){
  if(S.pushBusy)return;S.pushBusy=true;render();
  try{
    var reg=await navigator.serviceWorker.getRegistration();
    var sub=reg?await reg.pushManager.getSubscription():null;
    if(sub){await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe();}
    S.pushState='off';toast('Daily reminders turned off for this device.');
  }catch(e){fail(e);}
  S.pushBusy=false;render();
}

/* ------------------------------------------------------------------ boot */
function boot(){
  var app=$('app');
  var bad=!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY||String(CFG.SUPABASE_URL).indexOf('YOUR-')===0;
  if(bad){app.innerHTML='<div class="center-page"><div class="login"><h1>Set up needed</h1><p class="muted">Open <b>config.js</b> and paste your Supabase Project URL and anon key (Supabase, Project Settings, API). Then reload this page.</p></div></div>';return;}
  if(!window.supabase||!window.supabase.createClient){app.innerHTML='<div class="center-page"><div class="login"><h1>Could not load</h1><p class="muted">The Supabase library did not load. Check your internet connection and reload.</p></div></div>';return;}
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  sb.auth.getSession().then(function(r){
    if(r.data&&r.data.session)start(r.data.session);else renderLogin('');
  });
  sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT'){S.me=null;renderLogin('');}});
  setInterval(function(){if(S.me&&!S.modal&&!S.busy&&document.visibilityState==='visible')loadAll(true);},60000);
}
function renderLogin(msg){
  $('app').innerHTML='<div class="center-page"><form class="login" id="loginform"><div><h1>Lifeimpressions</h1><p class="muted">Studio tracker. Sign in with the email and password you were given.</p></div>'+
    '<label class="f">Email<input type="email" id="lg-email" autocomplete="username" required></label>'+
    '<label class="f">Password<input type="password" id="lg-pass" autocomplete="current-password" required></label>'+
    '<div class="msg" id="lg-msg" role="alert">'+esc(msg)+'</div><button class="btn gold" type="submit">Sign in</button></form></div>';
  var f=$('lg-email');if(f)f.focus();
}
async function doLogin(){
  var email=$('lg-email').value.trim(),pass=$('lg-pass').value;
  $('lg-msg').textContent='Signing in...';
  var r=await sb.auth.signInWithPassword({email:email,password:pass});
  if(r.error){$('lg-msg').textContent='Could not sign in. Check the email and password.';return;}
  start(r.data.session);
}
async function start(session){
  var r=await sb.from('staff').select('*').eq('user_id',session.user.id).maybeSingle();
  if(r.error||!r.data||!r.data.active){
    $('app').innerHTML='<div class="center-page"><div class="login"><h1>Not set up yet</h1><p class="muted">You are signed in, but your login is not linked to a staff record. Ask Keerthi to add you, then sign in again.</p><button class="btn ghost" data-a="signout">Sign out</button></div></div>';
    return;
  }
  S.me=r.data;
  if(location.hash==='#today'){S.view='today';history.replaceState(null,'',location.pathname+location.search);}
  render();
  refreshPushState().then(render);
  await loadAll(false);
}

  }));

}

/* ------------------------------------------------------------------ status rules (from the database view) */
function flags(j){
  var f=[];if(j.stage==='delivered')return f;
  if(j.overdue){
    if(j.stage==='booked')f.push({t:'late',l:'Session passed'});
    else f.push({t:'late',l:'Overdue '+Math.max(1,j.day_no-(j.complete_by==null?0:j.complete_by))+'d'});
  }
  if(j.changes_requested)f.push({t:'change',l:'Changes requested'});
  if(j.call_photo)f.push({t:'call',l:'Call: no photo'});
  else if(j.photo_missing&&j.day_no>=1)f.push({t:'wait',l:'Photo missing'});
  if(j.approval==='pending'){if(j.call_approval)f.push({t:'call',l:'Call: no approval'});else f.push({t:'wait',l:'Awaiting approval'});}
  return f;
}
function dayText(j){var d=j.day_no;return d<0?'In '+(-d)+' day'+(d===-1?'':'s'):(d===0?'Session today':'Day '+d);}
function needs(list){
  var out=[];
  (list||vJobs()).forEach(function(j){
    if(j.stage==='delivered')return;
    var fl=flags(j),rank=9;
    fl.forEach(function(f){if(f.t==='call')rank=Math.min(rank,0);if(f.t==='late')rank=Math.min(rank,1);if(f.t==='change')rank=Math.min(rank,2);});
    var reasons=fl.filter(function(f){return f.t!=='wait';});
    if(j.stage==='booked'&&j.day_no===0){reasons.push({t:'ok',l:'Casting session today'});rank=Math.min(rank,3);}
    if(j.stage==='layout_ready'){reasons.push({t:'ok',l:'Layout ready to send'});rank=Math.min(rank,3);}
    if(j.stage==='quality_check'&&!j.qc_approved){reasons.push({t:'ok',l:'QC pending'});rank=Math.min(rank,3);}
    if(reasons.length)out.push({j:j,reasons:reasons,rank:rank});
  });
  out.sort(function(a,b){return a.rank-b.rank;});
  return out;
}
function locationsInScope(){
  if(isAdmin())return (S.ref.locations||[]).filter(function(l){return S.locFilter==='all'||l.id===Number(S.locFilter);});
  return (S.ref.locations||[]).filter(function(l){return l.id===S.me.location_id;});
}
function personFor(locId){var s=S.staff.filter(function(x){return x.location_id===locId&&x.active;})[0];return s?s.name:'Unassigned';}
function morningPlan(locId){
  var t=todayISO(),jobs=S.jobs.filter(function(j){return j.location_id===locId&&j.stage!=='delivered';});
  return {
    sessions:jobs.filter(function(j){return j.stage==='booked'&&j.casting_date===t;}).sort(function(a,b){return a.sessionAt<b.sessionAt?-1:1;}),
    need:needs(jobs),
    fu:S.enq.filter(function(x){return x.location_id===locId&&x.next_follow_up&&x.next_follow_up<=t&&x.status!=='booked'&&x.status!=='lost';}),
    due:jobs.filter(function(j){return j.stage!=='booked'&&diffISO(j.promised_delivery,t)<=1;})
  };
}
function eveningReview(locId){
  var t=todayISO(),tmr=addISO(t,1);
  var jobs=S.jobs.filter(function(j){return j.location_id===locId;});
  return {
    done:S.historyToday.filter(function(h){return h.location_id===locId;}).map(function(h){return {job:jobById(h.job_id),from:h.from_stage,to:h.to_stage,at:h.changed_at,who:staffName(h.changed_by)};}).filter(function(x){return x.job;}),
    open:needs(jobs.filter(function(j){return j.stage!=='delivered';})),
    tomorrowSessions:jobs.filter(function(j){return j.stage==='booked'&&j.casting_date===tmr;}).sort(function(a,b){return a.sessionAt<b.sessionAt?-1:1;}),
    tomorrowFu:S.enq.filter(function(x){return x.location_id===locId&&x.next_follow_up===tmr;})
  };
}
function actionLabel(j){
  switch(j.stage){
    case 'booked':return 'Mark casting done';
    case 'casting_done':return j.photo_received_at?'Start finishing':'Request photo';
    case 'awaiting_photo':return 'Start finishing';
    case 'finishing':return 'Layout designed';
    case 'layout_ready':return 'Send layout to customer';
    case 'awaiting_approval':return j.approval==='changes'?'Send revised layout':'';
    case 'final_fixing':return 'Move to quality check';
    case 'quality_check':return 'Mark ready';
    case 'ready':return 'Mark delivered';
    default:return '';
  }
}

/* ------------------------------------------------------------------ actions */
async function upd(id,patch){var r=await sb.from('jobs').update(patch).eq('id',id);if(r.error)throw r.error;}
async function refreshAfter(msg){await loadAll(true);if(msg)toast(msg);}
async function advance(j){
  try{
    switch(j.stage){
      case 'booked':
        if(j.day_no<0){toast('The session is on '+fmt(j.casting_date)+'. Casting can be marked done from that day.',true);return;}
        await upd(j.id,{stage:'casting_done'});break;
      case 'casting_done':await upd(j.id,{stage:j.photo_received_at?'finishing':'awaiting_photo'});break;
      case 'awaiting_photo':await upd(j.id,{stage:'finishing'});break;
      case 'finishing':
        if(!j.photo_received_at){toast('The layout cannot be designed without the customer photo. Once the photo is received, it will unlock.',true);return;}
        await upd(j.id,{stage:'layout_ready'});break;
      case 'layout_ready':
        if(!jobFiles(j,'layout').length){toast('Upload the layout first.',true);return;}
        await upd(j.id,{stage:'awaiting_approval'});break;
      case 'awaiting_approval':
        if(j.approval!=='changes'){toast('Waiting for the customer to approve.');return;}
        var ls=jobFiles(j,'layout'),last=ls[ls.length-1];
        if(!last||(j.layout_sent_at&&new Date(last.created_at)<=new Date(j.layout_sent_at))){toast('Upload the revised layout first.',true);return;}
        await upd(j.id,{approval:'pending'});break;
      case 'final_fixing':await upd(j.id,{stage:'quality_check'});break;
      case 'quality_check':
        if(!j.qc_approved){toast('Quality check must be approved by head office first.',true);return;}
        await upd(j.id,{stage:'ready'});break;
      case 'ready':await upd(j.id,{stage:'delivered'});break;
      default:return;
    }
    await refreshAfter(j.job_no+' updated.');
    loadMsgs(j.id);
  }catch(e){fail(e);}
}
function compress(file){
  return new Promise(function(res,rej){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var max=1600,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h));
      w=Math.round(w*s);h=Math.round(h*s);
      var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(function(b){URL.revokeObjectURL(url);b?res(b):rej(new Error('Could not process the image.'));},'image/jpeg',0.8);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('That file is not an image.'));};
    img.src=url;
  });
}
async function uploadFile(j,kind,file){
  S.busy=true;render();
  try{
    var blob=await compress(file);
    var path=j.location_id+'/'+j.id+'/'+kind+'-'+Date.now()+'.jpg';
    var up=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:false});
    if(up.error)throw up.error;
    var ins=await sb.from('job_files').insert({job_id:j.id,kind:kind,storage_path:path});
    if(ins.error)throw ins.error;
    if(kind==='photo'&&!j.photo_received_at)await upd(j.id,{photo_received_at:new Date().toISOString()});
    await loadAll(true);
    toast('Uploaded.');
  }catch(e){S.busy=false;fail(e);return;}
  S.busy=false;render();
}

  var pushCard='<div class="panel"><h2>Daily reminders on this device</h2><p class="muted small" style="margin-bottom:10px">A short notification at 9am and 5pm summarising sessions and jobs needing attention, even when the tracker is closed. This is set up per device, so turn it on separately on your phone and your computer if you use both.</p>'+pushWidget('')+'</div>';
  var h='<div class="stack">'+pushCard+vOnline()+vClosed()+'<div class="panel"><h2>Staff</h2><div class="tablewrap"><table><thead><tr><th>Person</th><th>Role</th><th>Location</th><th>Phone</th></tr></thead><tbody>'+
    S.staff.map(function(s){return '<tr><td>'+esc(s.name)+'</td><td>'+(s.role==='admin'?'Admin':'Location staff')+'</td><td>'+esc(locName(s.location_id))+'</td><td>'+esc(s.phone||'')+'</td></tr>';}).join('')+'</tbody></table></div></div>';
  h+='<div class="panel"><h2>Services and prices (incl. 5% GST)</h2><div class="tablewrap"><table><thead><tr><th>Service</th><th>Duration</th><th>Price</th><th>QC checklist</th></tr></thead><tbody>'+
    (R.services||[]).map(function(s){return '<tr><td>'+esc(s.name)+'</td><td>'+esc(s.duration_hours)+' hr</td><td>'+(s.is_from_price?'from ':'')+inr(s.price_incl_gst)+'</td><td>'+(s.qc_checklist?'Yes':'No')+'</td></tr>';}).join('')+'</tbody></table></div><p class="small muted" style="margin-top:10px">The checklist applies to baby services. To change this, tick or untick qc_checklist for a service in Supabase (Table Editor, services).</p></div>';
  h+='<div class="panel"><h2>Frame sizes and add-ons</h2><p class="muted small" style="margin-bottom:10px">Frame price is included in the service price.</p><div class="tablewrap"><table><tbody>'+
    (R.frames||[]).map(function(f){return '<tr><td>Frame: '+esc(f.name)+'</td><td class="muted">Included in service price</td></tr>';}).join('')+
    (R.addons||[]).map(function(a){return '<tr><td>Add-on: '+esc(a.name)+'</td><td>'+inr(a.price_incl_gst)+'</td></tr>';}).join('')+'</tbody></table></div></div>';
  h+='<div class="panel"><h2>Stage targets (days from casting)</h2><div class="tablewrap"><table><thead><tr><th>Stage</th><th>Complete by</th></tr></thead><tbody>'+
    (R.stages||[]).map(function(s){return '<tr><td>'+esc(STAGE_NAMES[s.stage])+'</td><td>'+(s.complete_by_day==null?'Customer or staff paced':'Day '+s.complete_by_day)+'</td></tr>';}).join('')+'</tbody></table></div></div>';
  return h+'<p class="small muted">Prices, staff and targets are changed in Supabase for now (Table Editor). Editing screens can be added later.</p></div>';
}

/* job drawer */
function vJob(j){
  var i=stageIdx(j),fl=flags(j),h='',track='';
  for(var k=0;k<10;k++){track+='<i class="'+(k<i?'done':(k===i?'now':''))+'"></i>';}
  h+='<div class="jhead"><div><h1>'+esc(j.customer)+'</h1><p class="muted">'+esc(j.job_no)+' \u00B7 '+esc(j.service)+' \u00B7 '+esc(j.frame)+' frame'+(j.addons.length?' \u00B7 '+esc(j.addons.join(', ')):'')+'</p></div><button class="btn ghost" data-a="close">Close</button></div>';
  h+='<div class="jgrid"><div class="stack">';
  var by=j.complete_by;
  h+='<div class="panel"><div class="spread"><h2>'+esc(STAGE_NAMES[j.stage])+'</h2><span class="muted small">'+esc(dayText(j))+(by!=null&&i>0?' \u00B7 complete by day '+by:'')+'</span></div><div class="track" aria-hidden="true">'+track+'</div>';
  if(fl.length)h+='<div class="row" style="margin-top:8px">'+fl.map(chip).join('')+'</div>';
  h+=stageControls(j);
  h+='</div>';
  h+=vJobSheet(j);
  var appr={none:'Not sent yet',pending:'Sent, waiting for reply',approved:'Approved by customer',changes:'Customer asked for changes'}[j.approval];
  h+='<div class="panel"><h2>Checklist</h2>';
  h+='<div class="check"><div class="l"><b>Customer photo</b><span class="muted small">'+(j.photo_received_at?'Received '+esc(fmtShort(j.photo_received_at.slice(0,10))):'Not received')+'</span></div>'+
     (j.photo_received_at?'<span class="chip ok">Received</span>':'<label class="btn sm ghost filebtn">Upload photo<input type="file" accept="image/*" data-upload="photo" data-id="'+j.id+'"></label>')+'</div>';
  h+='<div class="check"><div class="l"><b>Design layout</b><span class="muted small">'+appr+(j.layout_sent_at?' \u00B7 sent '+esc(fmtShort(j.layout_sent_at.slice(0,10))):'')+'</span></div>'+
     (j.approval==='approved'?'<span class="chip ok">Approved</span>':(j.approval==='changes'?'<span class="chip change">Changes</span>':(j.approval==='pending'?'<span class="chip wait">Waiting</span>':'')))+'</div>';
  h+='<div class="check"><div class="l"><b>Quality check</b><span class="muted small">'+(j.qcList?'All 10 checks ticked, QC photo uploaded, approved by head office':'QC photo uploaded and approved by head office')+'</span></div>'+(j.qc_approved?'<span class="chip ok">Approved</span>':'<span class="muted small">Not yet</span>')+'</div>';
  h+='</div>';
  h+=vQcTable(j);
  var all=jobFiles(j);
  h+='<div class="panel"><div class="spread" style="margin-bottom:10px"><h2>Photos and files</h2><label class="btn sm ghost filebtn">Add progress photo<input type="file" accept="image/*" data-upload="progress" data-id="'+j.id+'"></label></div>';
  if(!all.length)h+='<div class="empty">No files yet.</div>';
  else{h+='<div class="thumbs">'+all.map(function(f){var u=S.urls[f.storage_path];return '<figure>'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" alt="'+esc(f.kind)+' photo"></a>':'<img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">')+'<figcaption>'+esc(f.kind)+'</figcaption></figure>';}).join('')+'</div>';}
  h+='</div>';
  h+='<div class="panel"><h2>Notes and updates sent</h2>'+(j.notes?'<div style="white-space:pre-wrap;font-size:14px">'+esc(j.notes)+'</div>':'<div class="empty">Nothing logged yet.</div>')+'</div>';
  h+=vCustomer(j);
  var staffOpts=S.staff.filter(function(s){return s.active&&(s.location_id===j.location_id||s.role==='admin');});
  h+='<div class="panel"><h2>Details</h2><dl class="facts">'+
    '<div><dt>Assigned to</dt><dd><label class="sr" for="asg">Assigned to</label><select id="asg" data-change="assign" data-id="'+j.id+'">'+staffOpts.map(function(s){return '<option value="'+s.id+'"'+(s.id===j.assigned_to?' selected':'')+'>'+esc(s.name)+'</option>';}).join('')+'</select></dd></div>'+
    '<div><dt>Location</dt><dd>'+esc(j.loc)+'</dd></div>'+
    '<div><dt>Casting session</dt><dd>'+esc(fmt(j.casting_date))+', '+esc(fmtTime(j.sessionAt))+'</dd></div>'+
    '<div><dt>Delivery by</dt><dd>'+esc(fmt(j.promised_delivery))+(j.wait_days?'<br><span class="chip wait">+'+j.wait_days+' days: customer delay</span>':'')+'</dd></div>'+
    '<div style="grid-column:1/-1"><dt>Charges</dt><dd id="dt-charges" style="font-weight:400">'+chargesHtml(j)+'</dd></div>'+
    '<div><dt>Advance paid (\u20B9)</dt><dd class="row"><label class="sr" for="adv">Advance paid</label><input type="number" id="adv" min="0" value="'+esc(j.advance)+'" style="min-height:36px;width:110px"><button class="btn sm ghost" data-a="save-advance" data-id="'+j.id+'">Save</button></dd></div>'+
    '<div><dt>Travel charges (\u20B9)</dt><dd class="row"><label class="sr" for="trv">Travel charges</label><input type="number" id="trv" min="0" step="1" value="'+esc(j.travel||0)+'" style="min-height:36px;width:110px"><button class="btn sm ghost" data-a="save-travel" data-id="'+j.id+'">Save</button></dd><span class="small muted">Doorstep Ola/Uber fare. Added to the balance.</span></div>'+
    '<div><dt>GST invoice no.</dt><dd class="row"><label class="sr" for="inv">GST invoice number</label><input type="text" id="inv" value="'+esc(j.invoice_no||'')+'" style="min-height:36px;width:130px"><button class="btn sm ghost" data-a="save-invoice" data-id="'+j.id+'">Save</button></dd></div></dl>'+
    (j.stage!=='delivered'?'<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)"><button class="btn sm ghost" data-a="cancel-booking" data-id="'+j.id+'" style="color:var(--rose)">Cancel booking</button></div>':'')+'</div>';
  h+='</div><div>'+phone(j)+'</div></div>';
  return h;
}
function shText(j,k,label,hint,type,extra){
  var v=sheetOf(j)[k];v=v==null?'':v;
  return '<label class="f">'+esc(label)+(hint?'<span class="h">'+esc(hint)+'</span>':'')+'<input type="'+(type||'text')+'" id="sh-'+k+'" data-change="sh-field" data-id="'+j.id+'" data-key="'+k+'" value="'+esc(v)+'" autocomplete="off"'+(extra||'')+'></label>';
}
function shSelect(j,k,label,opts,hint,blank){
  var v=sheetOf(j)[k]||'';
  return '<label class="f">'+esc(label)+(hint?'<span class="h">'+esc(hint)+'</span>':'')+'<select id="sh-'+k+'" data-change="sh-field" data-id="'+j.id+'" data-key="'+k+'"><option value="">'+esc(blank||'Select')+'</option>'+
    opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===v?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select></label>';
}
function shCheck(j,k,text){

}

    '<div><dt>Name</dt><dd>'+esc(j.customer)+'</dd></div>'+
    '<div><dt>WhatsApp</dt><dd>'+esc(j.phone)+'</dd></div>'+
    '<div style="grid-column:1/-1"><dt><label for="ct-email">Email</label></dt><dd><input type="email" id="ct-email" value="'+esc(j.email)+'" placeholder="Not provided" autocomplete="off"></dd></div>'+
    '<div style="grid-column:1/-1"><dt><label for="ct-addr">Address</label></dt><dd><input type="text" id="ct-addr" value="'+esc(j.address)+'" placeholder="Not provided" autocomplete="off"></dd></div>'+
    (j.sessionAddress?'<div style="grid-column:1/-1"><dt>Booking address (from the website)</dt><dd style="font-weight:400">'+esc(j.sessionAddress)+'</dd></div>':'')+

function vQcTable(j){
  if(!j.qcList||stageIdx(j)<STAGE_KEYS.indexOf('quality_check'))return '';
  var edit=(j.stage==='quality_check'&&!j.qc_approved),c=j.qc_checks||{},n=qcCount(j);
  var chip=j.qc_approved?'<span class="chip ok">QC Passed</span>':'<span class="chip '+(n===QC_ITEMS.length?'ok':'wait')+'">'+n+' of '+QC_ITEMS.length+' passed</span>';
  var h='<div class="panel"><div class="spread" style="margin-bottom:6px"><h2>Customer requirement checklist</h2>'+chip+'</div>'+
    '<p class="muted small" style="margin-bottom:10px">'+(edit?'Tick each point once it matches what the customer asked for, including when they asked for none. All '+QC_ITEMS.length+' must pass before QC can be approved.':(j.qc_approved?'QC is approved, so this checklist is locked.':'Read only.'))+'</p>'+
    '<div class="tablewrap"><table class="qc"><thead><tr><th>Description</th><th>Customer requirement</th><th class="qcchk">QC Passed</th></tr></thead><tbody>';
  QC_ITEMS.forEach(function(it,i){
    var k=it[0],row=c[k]||{};
    h+='<tr><td>'+(i+1)+'. '+esc(it[1])+'</td>'+
      '<td><input type="text" id="qcn-'+k+'" data-change="qc-note" data-id="'+j.id+'" data-key="'+k+'" value="'+esc(row.note||'')+'" aria-label="Customer requirement for '+esc(it[1])+'" placeholder="Optional"'+(edit?'':' disabled')+'></td>'+
      '<td class="qcchk"><input type="checkbox" id="qc-'+k+'" data-change="qc-check" data-id="'+j.id+'" data-key="'+k+'"'+(row.ok?' checked':'')+' aria-label="QC passed: '+esc(it[1])+'"'+(edit?'':' disabled')+'></td></tr>';
  });
  return h+'</tbody></table></div></div>';
}
async function saveQc(j,checks,doRender){
  var old=j.qc_checks;j.qc_checks=checks;
  if(doRender)render();
  var r=await sb.from('jobs').update({qc_checks:checks}).eq('id',j.id);
  if(r.error){j.qc_checks=old;render();fail(r.error);}
}
function stageControls(j){
  var lbl=actionLabel(j),h='',up=function(kind,text){return '<label class="btn sm ghost filebtn">'+text+'<input type="file" accept="image/*" data-upload="'+kind+'" data-id="'+j.id+'"></label>';};
  var lay=jobFiles(j,'layout').length,qc=jobFiles(j,'qc').length;
  h+='<div class="row" style="margin-top:14px">';
  if(j.stage==='layout_ready'||(j.stage==='awaiting_approval'&&j.approval==='changes'))h+=up('layout',lay?'Upload another layout':'Upload layout');
  if(j.stage==='awaiting_approval'&&j.approval==='pending'&&isAdmin())h+='<button class="btn gold" data-a="mark-approved" data-id="'+j.id+'">Mark approved</button>';
  if(j.stage==='quality_check'){
    h+=up('qc',qc?'Upload another QC photo':'Upload QC photo');
    if(!j.qc_approved){
      var qcReady=qc&&(!j.qcList||qcComplete(j));
      if(isAdmin())h+='<button class="btn ghost" data-a="approve-qc" data-id="'+j.id+'"'+(qcReady?'':' disabled')+'>Approve QC</button>';
      else h+='<span class="muted small">Head office approves QC.</span>';
      if(j.qcList&&!qcComplete(j))h+='<span class="muted small">'+qcCount(j)+' of '+QC_ITEMS.length+' checks done.</span>';
    }
  }
  h+='<button class="btn ghost" data-a="open-update" data-id="'+j.id+'">Send update</button>';
  if(lbl){
    var dis=false;
    if(j.stage==='layout_ready'&&!lay)dis=true;
    if(j.stage==='finishing'&&!j.photo_received_at)dis=true;
    if(j.stage==='quality_check'&&!j.qc_approved)dis=true;
    if(j.stage==='booked'&&j.day_no<0)dis=true;
    h+='<button class="btn gold" data-a="adv" data-id="'+j.id+'"'+(dis?' disabled':'')+'>'+esc(lbl)+'</button>';
  }
  h+='</div>';
  if(j.stage==='finishing'&&!j.photo_received_at)h+='<div class="rule" style="margin-top:12px">The layout cannot be designed without the customer photo. It has not arrived yet.</div>';
  if(j.stage==='awaiting_approval'&&j.approval==='pending')h+='<p class="small muted" style="margin-top:10px">Final fixing stays locked until the customer approves. Head office marks it approved once they reply.</p>';
  if(j.stage==='booked'&&j.day_no<0)h+='<p class="small muted" style="margin-top:10px">Casting can be marked done from '+esc(fmt(j.casting_date))+'.</p>';
  return h;
}
function phone(j){
  var msgs=S.msgs[j.id]||[],last=null;
  var h='<div class="phone" aria-label="Messages sent to the customer"><div class="bar1"><span class="av">L</span><div><b>Lifeimpressions</b><small>Messages with '+esc(j.customer)+'</small></div></div><div class="msgs" id="msgs">';
  if(!msgs.length)h+='<div class="dsep">No messages yet</div>';
  msgs.forEach(function(m){
    var dk=fmt(new Date(m.created_at).toISOString().slice(0,10));
    if(dk!==last){h+='<div class="dsep">'+esc(dk)+'</div>';last=dk;}
    h+='<div class="b'+(m.direction==='in'?' in':'')+'">'+esc(m.body||('['+(m.template||'message')+']'))+'<small>'+esc(fmtTime(m.created_at))+(m.status?' \u00B7 '+esc(m.status):'')+'</small></div>';
  });
  h+='</div><div class="phonefoot"><button class="btn sm ghost" data-a="reload-msgs" data-id="'+j.id+'">Refresh messages</button></div></div>';
  h+='<p class="demo">Updates sent with Send update are listed under Notes and updates sent. This history fills in by itself once the WhatsApp API is connected.</p>';
  return h;
}

/* dialogs */
function opt(list,sel){return list.map(function(x){var v=typeof x==='object'?x.v:x,l=typeof x==='object'?x.l:x;return '<option value="'+esc(v)+'"'+(String(v)===String(sel)?' selected':'')+'>'+esc(l)+'</option>';}).join('');}
function vBooking(pre){
  pre=pre||{};
  var R=S.ref,loc=pre.loc||(S.me.role==='admin'?(scopeLoc()||S.me.location_id):S.me.location_id);
  var times=[];for(var t=10;t<=16;t++){times.push((t<10?'0':'')+t+':00');}
  var locSel=S.me.role==='admin'?'<select id="b-loc">'+opt(R.locations.map(function(l){return {v:l.id,l:l.name};}),loc)+'</select>':'<select id="b-loc" disabled>'+opt(R.locations.filter(function(l){return l.id===loc;}).map(function(l){return {v:l.id,l:l.name};}),loc)+'</select>';
  return '<h2 id="dlgt">New booking</h2><p class="muted small" style="margin:4px 0 16px">Bookings from the website arrive here automatically. Use this for phone and walk-in bookings.</p><div class="form">'+
   '<label class="f full">Customer name<input type="text" id="b-name" value="'+esc(pre.name||'')+'" autocomplete="off"></label>'+
   '<label class="f">WhatsApp number<input type="tel" id="b-phone" value="'+esc(pre.phone||'')+'" placeholder="+91"></label>'+
   '<label class="f">Location'+locSel+'</label>'+
   '<label class="f">Email (optional)<input type="email" id="b-email" value="'+esc(pre.email||'')+'" autocomplete="off"></label>'+
   '<label class="f">Address (optional)<input type="text" id="b-addr" value="'+esc(pre.address||'')+'" autocomplete="off"></label>'+
   '<label class="f full">Service<select id="b-svc">'+(R.services||[]).filter(function(s){return s.active;}).map(function(s){return '<option value="'+s.id+'"'+(s.id===pre.service_id?' selected':'')+'>'+esc(s.name)+' ('+(s.is_from_price?'from ':'')+inr(s.price_incl_gst)+')</option>';}).join('')+'</select></label>'+

/* ------------------------------------------------------------------ events */
document.addEventListener('submit',function(ev){if(ev.target.id==='loginform'){ev.preventDefault();doLogin();}});
document.addEventListener('click',async function(ev){
  var el=ev.target.closest('[data-a]');if(!el)return;
  var a=el.getAttribute('data-a'),id=el.getAttribute('data-id');
  if(a==='scrim'){if(ev.target===el)closeModal();return;}
  try{
  switch(a){
    case 'nav':{S.view=el.getAttribute('data-v');S.modal=null;window.scrollTo(0,0);var mbr=document.querySelector('.mscroll-body');if(mbr)mbr.scrollTop=0;render();break;}
    case 'open-job':openModal({type:'job',id:id});break;
    case 'close':closeModal();break;
    case 'signout':await sb.auth.signOut();break;
    case 'push-on':await enablePush();break;
    case 'push-off':await disablePush();break;
    case 'refresh':await loadAll(false);break;
    case 'reload-msgs':loadMsgs(id);break;
    case 'brief-tab':S.briefTab=el.getAttribute('data-v');render();break;
    case 'new-booking':openModal({type:'booking',pre:{}});break;
    case 'inbox-book':{
      var row=S.inbox.filter(function(x){return String(x.id)===id;})[0],pl=(row&&row.payload)||{};
      var nz=function(t){return String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,'');};
      var sv=(S.ref.services||[]).filter(function(x){return nz(x.name)===nz(pl.service);})[0];
      var lc=(S.ref.locations||[]).filter(function(x){return nz(pl.location).indexOf(nz(x.name))>=0;})[0];
      openModal({type:'booking',pre:{name:pl.customer_name||'',phone:pl.whatsapp||'',email:pl.email||'',address:pl.address||'',sess:pl.location||'',service_id:sv?sv.id:undefined,loc:lc?lc.id:undefined,inboxId:row.id,wixId:row.wix_booking_id||''}});break;}
    case 'inbox-dismiss':{
      var rd=await sb.from('booking_inbox').update({status:'handled'}).eq('id',Number(id));
      if(rd.error)throw rd.error;await refreshAfter('Dismissed.');break;}
    case 'save-advance':{
      var jb=jobById(id),v=parseFloat($('adv').value);
      if(!(v>=0)){toast('Enter a valid amount.',true);return;}
      var ra=await sb.from('orders').update({advance_paid:v}).eq('id',jb.order_id);
      if(ra.error)throw ra.error;await refreshAfter('Advance saved.');break;}
    case 'save-travel':{
      var jtv=jobById(id),tvr=$('trv').value.trim(),tv=tvr===''?0:parseFloat(tvr);
      if(!(tv>=0)||tv>1000000){toast('Enter a valid amount.',true);return;}
      var rtv=await sb.from('orders').update({travel_charges:tv}).eq('id',jtv.order_id);
      if(rtv.error){
        if(/travel_charges/.test(rtv.error.message||'')){toast('Run 10_travel_charges.sql in Supabase first, then try again.',true);return;}
        throw rtv.error;
      }
      await refreshAfter('Travel charges saved.');break;}
    case 'site-ack':{var ra2=await sb.from('site_bookings').update({needs_staff_cancel:false}).eq('id',id);if(ra2.error)throw ra2.error;await refreshAfter('Marked done.');break;}
    case 'add-closed':{
      var cd=$('cl-day').value,cl=$('cl-loc')?Number($('cl-loc').value):S.me.location_id;
      if(!cd){toast('Choose a date.',true);return;}
      var rc=await sb.from('blocked_dates').insert({location_id:cl,day:cd,reason:($('cl-why').value||'').trim()||null});
      if(rc.error){if(/duplicate/i.test(rc.error.message||'')){toast('That day is already closed.',true);return;}throw rc.error;}
      await refreshAfter('Day closed for online booking.');break;}
    case 'del-closed':{
      var pr=id.split('|'),rd2=await sb.from('blocked_dates').delete().eq('location_id',Number(pr[0])).eq('day',pr[1]);
      if(rd2.error)throw rd2.error;await refreshAfter('Day reopened.');break;}
    case 'new-enq':openModal({type:'enq'});break;
    case 'cancel-booking':openModal({type:'cancel',id:id});break;
    case 'open-remind':openModal({type:'remind',id:id});break;
    case 'open-update':openModal({type:'update',id:id});break;
    case 'save-contact':{
      var jc=jobById(id),cem=$('ct-email').value.trim(),cad=$('ct-addr').value.trim();
      if(cem&&!/^\S+@\S+\.\S+$/.test(cem)){toast('That email address does not look right.',true);return;}
      var rc=await sb.from('customers').update({email:cem?cem.toLowerCase():null,address:cad||null}).eq('id',jc.customerId);
      if(rc.error)throw rc.error;
      await refreshAfter('Contact details saved.');break;}
    case 'back-job':openModal({type:'job',id:id});break;
    case 'send-update':{
      var ju=jobById(id),utxt=$('up-text').value.trim(),ukey=$('up-key').value;
      if(!utxt){toast('Write a message first.',true);return;}
      var ulink=waLink(ju.phone,utxt);
      if(!ulink){toast('No WhatsApp number on file for this customer.',true);return;}
      window.open(ulink,'_blank');
      var ustamp=new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
      var uline='['+ustamp+'] Update sent by '+S.me.name+': '+tplFor(ukey).l;
      var ur=await sb.from('jobs').update({notes:(ju.notes?ju.notes+'\n':'')+uline}).eq('id',id);
      if(ur.error)throw ur.error;
      S.modal={type:'job',id:id};await refreshAfter('WhatsApp opened for '+ju.customer+'. Tap send there.');break;}
    case 'mark-approved':openModal({type:'approve',id:id});break;
    case 'send-remind':{
      var ex=enqById(id),msg=$('rm-text').value.trim();
      if(!msg){toast('Write a message first.',true);return;}
      var link=waLink(ex.whatsapp,msg);
      if(!link){toast('No WhatsApp number on file for this enquiry.',true);return;}
      window.open(link,'_blank');
      var stamp=new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
      var line='['+stamp+'] Reminder sent by '+S.me.name;
      var rn=await sb.from('enquiries').update({notes:(ex.notes?ex.notes+'\n':'')+line}).eq('id',id);
      if(rn.error)throw rn.error;
      S.modal=null;await refreshAfter('Reminder opened in WhatsApp for '+ex.name+'.');break;}
    case 'confirm-approve':{
      var jb=jobById(id),note=$('ap-note').value.trim();
      var stamp=new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
      var line='['+stamp+'] Approved manually by '+S.me.name+(note?': '+note:' (no note given)');
      var ra2=await sb.from('jobs').update({approval:'approved',stage:'final_fixing',notes:(jb.notes?jb.notes+'\n':'')+line}).eq('id',id);
      if(ra2.error)throw ra2.error;
      S.modal=null;await refreshAfter('Marked approved. Final fixing is unlocked.');break;}
    case 'confirm-cancel':{
      var note=$('c-note').value.trim(),why=$('c-reason').value+(note?' - '+note:'');
      var rc=await sb.from('jobs').update({cancelled_at:new Date().toISOString(),cancel_reason:why}).eq('id',id);
      if(rc.error)throw rc.error;
      try{await sb.from('site_bookings').update({needs_staff_cancel:false}).eq('job_id',id);}catch(e){}
      S.modal=null;await refreshAfter('Booking cancelled. It is kept under Reports.');break;}
    case 'restore-booking':{
      var rs=await sb.from('jobs').update({cancelled_at:null}).eq('id',id);
      if(rs.error)throw rs.error;
      await refreshAfter('Booking restored to the board.');break;}
    case 'adv':await advance(jobById(id));break;
    case 'approve-qc':
      await upd(id,{qc_approved:true});await refreshAfter('Quality check approved.');break;
    case 'save-invoice':
      await upd(id,{invoice_no:$('inv').value.trim()||null});await refreshAfter('Invoice number saved.');break;
    case 'save-enq':{
      var nm=$('e-name').value.trim();
      if(!nm){toast('Enter the customer name.',true);return;}
      var svc=$('e-svc').value;
      var r=await sb.from('enquiries').insert({name:nm,whatsapp:$('e-phone').value.trim()||null,source:$('e-src').value,service_id:svc?Number(svc):null,location_id:Number($('e-loc').value),next_follow_up:$('e-fu').value||null,owner_id:S.me.id});
      if(r.error)throw r.error;
      S.modal=null;await refreshAfter('Enquiry added for '+nm+'.');break;}
    case 'save-lost':{
      var r2=await sb.from('enquiries').update({status:'lost',lost_reason:$('l-reason').value,next_follow_up:null}).eq('id',id);
      if(r2.error)throw r2.error;
      S.modal=null;await refreshAfter('Marked as lost.');break;}
    case 'save-booking':{
      var name=$('b-name').value.trim();
      if(!name){toast('Enter the customer name.',true);return;}
      if(!$('b-consent').checked){toast('Confirm the customer agreed to WhatsApp updates first.',true);return;}
      var addons=[];document.querySelectorAll('.b-ad').forEach(function(c){if(c.checked)addons.push(Number(c.value));});
      var bt=bookingTotals();
      var when=new Date($('b-date').value+'T'+$('b-time').value+':00+05:30').toISOString();
      var bem=$('b-email').value.trim(),bad=$('b-addr').value.trim(),bse=el.getAttribute('data-sess')||'';
      if(bem&&!/^\S+@\S+\.\S+$/.test(bem)){toast('That email address does not look right.',true);return;}
      var bargs={p_name:name,p_whatsapp:$('b-phone').value,p_opt_in:true,p_service_id:Number($('b-svc').value),p_frame_size_id:Number($('b-frame').value),p_addon_ids:addons,p_location_id:Number($('b-loc').value),p_session_at:when,p_advance:bt.adv,p_enquiry_id:el.getAttribute('data-enq')||null,p_wix_booking_id:el.getAttribute('data-wix')||null};
      if(bem)bargs.p_email=bem;if(bad)bargs.p_address=bad;if(bse)bargs.p_session_address=bse;
      var rr=await sb.rpc('create_booking',bargs);
      if(rr.error&&/p_email|p_address|p_session_address/.test(rr.error.message||'')){toast('Run 08_customer_contact.sql in Supabase first, or leave email and address blank.',true);return;}
      if(rr.error)throw rr.error;
      var ibx=el.getAttribute('data-inbox');if(ibx){await sb.from('booking_inbox').update({status:'handled'}).eq('id',Number(ibx));}
      S.modal=null;S.view='jobs';await refreshAfter('Booking created. Fill in the job sheet below.');
      if(rr.data){S.focusSheet=true;openModal({type:'job',id:rr.data});}break;}
  }
  }catch(e){fail(e);}
});
document.addEventListener('change',async function(ev){
  var t=ev.target,el=t.closest('[data-change]');
  try{
  if(t.matches('input[type=file][data-upload]')){
    var f=t.files&&t.files[0];if(!f)return;
    await uploadFile(jobById(t.getAttribute('data-id')),t.getAttribute('data-upload'),f);return;
  }
  if(el){
    var k=el.getAttribute('data-change'),id=el.getAttribute('data-id');
    if(k==='loc'){S.locFilter=el.value;render();}
    else if(k==='sh-field'){
      var js=jobById(id),sk=el.getAttribute('data-key'),patch={};
      patch[sk]=(el.type==='checkbox')?el.checked:el.value.trim();
      if(sk==='delivery'){
        var opt=SHEET_DELIVERY.filter(function(o){return o[0]===patch[sk];})[0];
        if(opt&&opt[2]!=null){patch.delivery_date=addISO(js.casting_date,opt[2]+(js.wait_days||0));var de=$('sh-delivery_date');if(de)de.value=patch.delivery_date;}
      }
      await saveSheet(js,patch);
    }
    else if(k==='qc-check'){
      var jq=jobById(id),qk=el.getAttribute('data-key'),cq=Object.assign({},jq.qc_checks||{});
      cq[qk]=Object.assign({},cq[qk]||{},{ok:el.checked});
      await saveQc(jq,cq,true);
    }
    else if(k==='qc-note'){
      var jn=jobById(id),nk=el.getAttribute('data-key'),cn=Object.assign({},jn.qc_checks||{});
      cn[nk]=Object.assign({},cn[nk]||{},{note:el.value.trim()});
      await saveQc(jn,cn,false);
    }
    else if(k==='upd-tpl'){var jt=jobById(id);$('up-text').value=tplFor(el.value).fn(jt);}
    else if(k==='assign'){await upd(id,{assigned_to:el.value});await refreshAfter('Assignee updated.');}
    else if(k==='enq-status'){
      var x=enqById(id),v=el.value;
      if(v==='lost'){el.value=x.status;openModal({type:'lost',id:id});}
      else if(v==='booked'){el.value=x.status;openModal({type:'booking',pre:{name:x.name,phone:x.whatsapp||'',service_id:x.service_id,loc:x.location_id,enqId:x.id}});}
      else{var r=await sb.from('enquiries').update({status:v,lost_reason:null}).eq('id',id);if(r.error)throw r.error;await refreshAfter();}
    }
    return;
  }
  if(S.modal&&S.modal.type==='booking'&&/^b-/.test(t.id||''))updateSummary();
  }catch(e){fail(e);}
});
document.addEventListener('input',function(ev){if(S.modal&&S.modal.type==='booking'&&ev.target.id==='b-adv')updateSummary();});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.modal)closeModal();});

if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message',function(ev){
    if(ev.data&&ev.data.type==='navigate'&&ev.data.view){
      S.view=ev.data.view;S.modal=null;
      if(S.me){render();window.scrollTo(0,0);}
    }
  });
}

boot();
})();
</script>
</body>
</html>
